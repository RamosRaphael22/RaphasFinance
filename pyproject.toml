[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-app"
version = "0.1.0"
description = "Organizador pessoal de finanças com armazenamento local em CSV."
requires-python = ">=3.11"
dependencies = ["customtkinter>=5.2,<6"]

[project.scripts]
finance-app = "finance_app.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
